name: Release
#
# ---------------------------------------------------------------------------
# macOS code signing / notarization
# ---------------------------------------------------------------------------
# There is no Apple Developer account yet, so `build.mac.identity` in
# package.json is "-" (ad-hoc). Ad-hoc signing is what makes the Apple Silicon
# build launchable at all -- an unsigned arm64 bundle is refused by the kernel
# -- but it is NOT accepted by Gatekeeper on other machines, so users must
# right-click > Open (or run `xattr -dr com.apple.quarantine <app>`) once.
#
# To turn on real signing + notarization once certificates exist:
#   1. package.json  -> "build": { "mac": { "notarize": true } }   (one line)
#   2. package.json  -> remove  "identity": "-"  so the Developer ID cert in
#                       the keychain is auto-discovered
#   3. delete the CSC_IDENTITY_AUTO_DISCOVERY line from the publish step below
#   4. add these repository secrets and pass them through as env vars:
#        CSC_LINK              base64 of the Developer ID .p12
#        CSC_KEY_PASSWORD      its password
#        APPLE_ID              Apple account email
#        APPLE_APP_SPECIFIC_PASSWORD
#        APPLE_TEAM_ID
# The entitlements in build/entitlements.mac*.plist already cover the hardened
# runtime requirements, so nothing there needs to change.
# ---------------------------------------------------------------------------

on:
  push:
    tags: ['v*']

# The publish job creates the GitHub Release and uploads assets to it, which
# needs write access to repository contents.
permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS (dmg + zip, arm64 + x64)
            # The zip target is what produces latest-mac.yml; electron-updater
            # cannot update a macOS app from a dmg.
            builder_args: --mac
          - os: windows-latest
            label: Windows (nsis + portable, x64)
            builder_args: --win

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A tag that disagrees with package.json would publish assets under a
      # release electron-updater never looks at. Fail early instead.
      - name: Verify tag matches package.json version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi
          echo "Releasing v$pkg"

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build main / preload / renderer
        run: npm run build

      # --publish never, deliberately. Two matrix jobs racing `--publish always`
      # against the same tag each create their own draft release, because
      # neither finds one already there -- which split v0.3.0 across two drafts,
      # one holding the macOS assets and the other the Windows ones. Packaging
      # and publishing are separated so exactly one job ever creates a release.
      # electron-builder still emits latest.yml / latest-mac.yml here.
      - name: Package
        run: npx --no-install electron-builder ${{ matrix.builder_args }} --publish never
        env:
          # No Apple Developer account yet: stop electron-builder from hunting
          # the keychain for a signing identity. Drop this (and flip
          # build.mac.notarize to true) once certificates are available.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          retention-days: 14
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.blockmap
            dist/latest*.yml

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Collect installers
        uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: dist

      # latest.yml and latest-mac.yml are the auto-update feeds. If either is
      # missing the corresponding platform silently stops receiving updates,
      # so treat their absence as a failed release rather than shipping.
      - name: Verify both auto-update feeds are present
        run: |
          ls -la dist
          missing=0
          for f in latest.yml latest-mac.yml; do
            [ -f "dist/$f" ] || { echo "::error::dist/$f missing"; missing=1; }
          done
          exit $missing

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Oh My Pi Desktop $GITHUB_REF_NAME" \
            --generate-notes
          {
            echo "### $GITHUB_REF_NAME published"
            echo
            gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --json assets -q '.assets[] | "- \(.name)"'
          } >> "$GITHUB_STEP_SUMMARY"
